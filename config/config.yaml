dataset_path_2d: "data/Teeth2D"
dataset_path_3d: "data/Teeth3DS+"
class_ids: [0, 
  11, 12, 13, 14, 15, 16, 17, 18, 
  21, 22, 23, 24, 25, 26, 27, 28, 
  31, 32, 33, 34, 35, 36, 37, 38, 
  41, 42, 43, 44, 45, 46, 47, 48]
2d_projection:
  image_size: [512, 512]
  background_value: 255
  distance: 80
  fov: 60
  views: # each view is [elevation, azimuth]
    - [0, 0]    # top down
    - [-90, 0]  # front center
    - [90, 0]   # back center
    - [-60, 0]  # top down front diagonal center
    - [60, 0]   # top down back diagonal center
    - [0, -45]  # top down front diagonal left
    - [0, 45]   # top down front diagonal right
    - [60, -45] # bottom up back diagonal left
    - [60, 45]  # bottom up back diagonal right
    - [0, -90]  # left side
    - [0, 90]   # right side
